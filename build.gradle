plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
	// Litematica und MaLiLib kommen von Modrinth
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup('maven.modrinth') }
	}
	// Lambda (nur Printer, GPL-3.0) liegt fertig gebaut im Repo, Quellcode: github.com/recher1001/claude, Branch claude/lambda-legit
	maven {
		url = file('libs/maven')
		content { includeGroup('com.lambda') }
	}
	// Baritone in der Version, mit der Lambda gebaut ist (Lambda braucht es zum Starten)
	maven {
		url = 'https://maven.2b2t.vc/releases'
		content { includeGroup('com.github.rfresh2') }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Gleiche Mappings wie Litematica (offizielle Mojang-Namen)
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "maven.modrinth:malilib:${project.malilib_modrinth_id}"
	modImplementation "maven.modrinth:litematica:${project.litematica_modrinth_id}"

	// Der Printer baut mit Lambda: Lambda und Fabric Language Kotlin werden in die .jar eingebettet (Jar-in-Jar),
	// es muss also nur Easy Place 2.0 installiert werden. Angesteuert wird Lambda per Reflection (PrinterController).
	include "com.lambda:lambda:${project.lambda_version}"
	include "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	// Damit Lambda auch beim Starten aus der Entwicklungsumgebung (Spieltest) geladen wird
	modLocalRuntime "com.lambda:lambda:${project.lambda_version}"
	modLocalRuntime "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	// Lambda startet nicht ohne Baritone (Pflicht-Mixin). Pathing ist im Lambda-Printer aus, Baritone laeuft also nicht von selbst.
	include "com.github.rfresh2:baritone-fabric:${project.minecraft_version}-SNAPSHOT"
	modLocalRuntime "com.github.rfresh2:baritone-fabric:${project.minecraft_version}-SNAPSHOT"

	// Baritone ist nicht mehr dabei: der Printer laeuft selbst (printer/path). Wer Baritone selbst installiert,
	// kann es ueber "Mit Baritone laufen" weiter benutzen (per Reflection, BaritoneBridge).
}

// Automatischer Spieltest (src/gametest): startet Minecraft mit Litematica + Easy Place 2.0,
// verbindet sich mit einem Vanilla-Server und klickt ganz normal. Ausfuehren: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'easyplace2-test'
		enableGameTests = false
		enableClientGameTests = true
		eula = true // Zustimmung zur Minecraft-EULA, noetig um den Testserver zu starten
	}
}

afterEvaluate {
	loom.runs.findByName('clientGameTest')?.vmArg('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
}

processResources {
	def props = [version: project.version, malilib_version: project.malilib_version, litematica_version: project.litematica_version]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
