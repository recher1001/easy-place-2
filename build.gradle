plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}

repositories {
	// Litematica und MaLiLib kommen von Modrinth
	maven {
		url = 'https://api.modrinth.com/maven'
		content { includeGroup('maven.modrinth') }
	}
	// Baritone: offizielle Releases von GitHub (cabaletta/baritone)
	ivy {
		name = 'BaritoneReleases'
		url = 'https://github.com/'
		patternLayout {
			artifact '[organisation]/[module]/releases/download/v[revision]/[module]-standalone-fabric-[revision].[ext]'
		}
		metadataSources { artifact() }
		content { includeGroup('cabaletta') }
	}
}

configurations {
	baritoneJar { transitive = false }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Gleiche Mappings wie Litematica (offizielle Mojang-Namen)
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "maven.modrinth:malilib:${project.malilib_modrinth_id}"
	modImplementation "maven.modrinth:litematica:${project.litematica_modrinth_id}"

	// Baritone (nur zum Laufen) wird mit in die .jar gepackt, man muss es nicht extra installieren.
	// Angesprochen wird es weiter per Reflection (BaritoneBridge). LGPL-3.0, unveraendert.
	modLocalRuntime "cabaletta:baritone:${project.baritone_version}"
	include "cabaletta:baritone:${project.baritone_version}"
	// Im Spieltest/Entwicklungs-Start laedt Loom die in Baritone eingebetteten Jars (nether-pathfinder) nicht
	// selbst; im normalen Spiel macht das Fabric. Deshalb hier zusaetzlich auf den Laufzeit-Klassenpfad.
	baritoneJar "cabaletta:baritone:${project.baritone_version}"
	localRuntime files({ zipTree(configurations.baritoneJar.singleFile).matching { include 'META-INF/jars/*.jar' }.files })
}

// Automatischer Spieltest (src/gametest): startet Minecraft mit Litematica + Easy Place 2.0,
// verbindet sich mit einem Vanilla-Server und klickt ganz normal. Ausfuehren: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'easyplace2-test'
		enableGameTests = false
		enableClientGameTests = true
		eula = true // Zustimmung zur Minecraft-EULA, noetig um den Testserver zu starten
	}
}

afterEvaluate {
	loom.runs.findByName('clientGameTest')?.vmArg('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
}

processResources {
	def props = [version: project.version, malilib_version: project.malilib_version, litematica_version: project.litematica_version]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
