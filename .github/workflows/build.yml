# Baut die Mod bei jedem Push automatisch auf GitHub.
# Die fertige .jar liegt danach unter "Actions" -> letzter Lauf -> "Artifacts".
name: build
on:
  push:
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: 'Screenshots des Spieltests auf den Branch ci-screenshots legen'
        type: boolean
        default: false
      publish_jar:
        description: 'Die fertige .jar auf den Branch ci-build legen'
        type: boolean
        default: false
      inspect_api:
        description: 'Signaturen einiger Minecraft-Klassen ins Log schreiben (Entwicklung)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      # Nur fuer die Entwicklung: Methoden-Signaturen (javap, ohne Code) einiger Klassen ins Log
      - name: inspect minecraft api
        if: github.event_name == 'workflow_dispatch' && inputs.inspect_api
        run: |
          JAR=""
          for j in $(find ~/.gradle .gradle -name '*.jar' -path '*minecraft*' -not -name '*sources*' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/gui/Font.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          echo "=== gizmo/debug classes"
          unzip -l "$JAR" | grep -oE 'net/minecraft/(gizmos|client/renderer/debug|client/renderer/ShapeRenderer|client/renderer/RenderType|client/renderer/rendertype)[^ ]*\.class' | sort | head -120
          for c in net.minecraft.gizmos.Gizmos net.minecraft.gizmos.GizmoStyle net.minecraft.gizmos.GizmoProperties net.minecraft.gizmos.CuboidGizmo net.minecraft.client.renderer.ShapeRenderer net.minecraft.client.renderer.debug.DebugRenderer; do
            echo "=== $c"; javap -cp "$JAR" "$c" 2>&1 | head -80
          done
          echo "=== fabric rendering"
          for j in $(find ~/.gradle .gradle -name 'fabric-rendering-v1*.jar' -not -name '*sources*' 2>/dev/null | head -3); do
            echo "jar $j"; unzip -l "$j" | grep -oE 'net/fabricmc/fabric/api/client/rendering/v1/[^ ]*World[^ ]*\.class' | sort
            for c in $(unzip -l "$j" | grep -oE 'net/fabricmc/fabric/api/client/rendering/v1/(world/)?World[A-Za-z]*\.class' | sed 's/\.class//; s#/#.#g' | sort -u); do
              echo "--- $c"; javap -cp "$j" "$c" 2>&1 | head -60
            done
          done
          echo "=== malilib render"
          for j in $(find ~/.gradle .gradle -iname '*malilib*.jar' -not -name '*sources*' 2>/dev/null | head -2); do
            echo "jar $j"
            for c in fi.dy.masa.malilib.event.RenderEventHandler fi.dy.masa.malilib.interfaces.IRenderer fi.dy.masa.malilib.render.RenderUtils; do
              echo "--- $c"; javap -cp "$j" "$c" 2>&1 | grep -iE "class|interface|world|Box|Line|Outline|onRender" | head -60
            done
          done
      # Ist der Artifact-Speicher auf GitHub voll, bleibt der Build trotzdem gruen
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: easy-place-2
          path: build/libs/
          retention-days: 7
      # Nur bei manuellem Start mit Haken: die .jar als eigener Branch, z. B. zum Herunterladen ohne Artifact
      - name: publish jar to branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_jar
        run: |
          mkdir -p ci-build && cp build/libs/*.jar ci-build/
          cd ci-build
          git init -q -b ci-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build aus Lauf ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build

  # Startet Minecraft (ohne Bildschirm) und testet Easy Place 2.0 gegen einen Vanilla-Server
  client_game_test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game test
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace
      - name: upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: client-game-test
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/latest.log
          if-no-files-found: ignore
          retention-days: 7
      # Nur bei manuellem Start mit Haken: Screenshots als eigener Branch, z. B. zum Ansehen ohne Artifact-Download
      - name: publish screenshots to branch
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_screenshots
        run: |
          cd build/run/clientGameTest/screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots aus Lauf ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
