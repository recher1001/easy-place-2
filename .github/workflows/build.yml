# Baut die Mod bei jedem Push automatisch auf GitHub.
# Die fertige .jar liegt danach unter "Actions" -> letzter Lauf -> "Artifacts".
name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: list litematica/malilib versions on modrinth (temporary)
        run: |
          for p in litematica malilib; do
            curl -sS "https://api.modrinth.com/v2/project/$p/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" \
              | python3 -c 'import json,sys; [print(v["id"], v["version_number"], v["date_published"][:10]) for v in json.load(sys.stdin)[:8]]'
          done
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: easy-place-2
          path: build/libs/
