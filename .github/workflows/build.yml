# Baut die Mod bei jedem Push automatisch auf GitHub.
# Die fertige .jar liegt danach unter "Actions" -> letzter Lauf -> "Artifacts".
name: build
on:
  push:
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: 'Screenshots des Spieltests auf den Branch ci-screenshots legen'
        type: boolean
        default: false
      publish_jar:
        description: 'Die fertige .jar auf den Branch ci-build legen'
        type: boolean
        default: false
      inspect_api:
        description: 'Signaturen einiger Minecraft-Klassen ins Log schreiben (Entwicklung)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      # Nur fuer die Entwicklung: Methoden-Signaturen (javap, ohne Code) einiger Klassen ins Log
      - name: inspect minecraft api
        if: github.event_name == 'workflow_dispatch' && inputs.inspect_api
        run: |
          JAR=""
          for j in $(find ~/.gradle .gradle -name '*.jar' -path '*minecraft*' -not -name '*sources*' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/gui/Font.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          for v in 1.20.0 1.12.0; do
            echo "=== baritone $v"
            curl -sL -o /tmp/b.jar "https://github.com/cabaletta/baritone/releases/download/v$v/baritone-standalone-fabric-$v.jar" && ls -la /tmp/b.jar
            unzip -p /tmp/b.jar fabric.mod.json | head -40
            unzip -l /tmp/b.jar | tail -2
          done
          curl -s "https://api.github.com/repos/cabaletta/baritone/releases/tags/v1.20.0" | grep -E '"name"|"body"|"published_at"' | head -5
      # Ist der Artifact-Speicher auf GitHub voll, bleibt der Build trotzdem gruen
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: easy-place-2
          path: build/libs/
          retention-days: 7
      # Nur bei manuellem Start mit Haken: die .jar als eigener Branch, z. B. zum Herunterladen ohne Artifact
      - name: publish jar to branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_jar
        run: |
          mkdir -p ci-build && cp build/libs/*.jar ci-build/
          cd ci-build
          git init -q -b ci-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build aus Lauf ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build

  # Startet Minecraft (ohne Bildschirm) und testet Easy Place 2.0 gegen einen Vanilla-Server
  client_game_test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game test
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace
      - name: upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: client-game-test
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/latest.log
          if-no-files-found: ignore
          retention-days: 7
      # Nur bei manuellem Start mit Haken: Screenshots als eigener Branch, z. B. zum Ansehen ohne Artifact-Download
      - name: publish screenshots to branch
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish_screenshots
        run: |
          cd build/run/clientGameTest/screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots aus Lauf ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
